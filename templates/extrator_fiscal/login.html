{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema | Controle Financeiro Rural</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('rural_theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
      padding: 1.5rem;
      position: relative;
    }

    .login-floating-actions {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 10;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-md);
      transition: all var(--transition);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(16, 185, 129, 0.12);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .login-sub {
      font-size: 0.825rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .login-form-group {
      margin-bottom: 1.2rem;
    }

    .login-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .login-input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: inherit;
      transition: all var(--transition);
    }

    .login-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .btn-login {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all var(--transition);
    }

    .btn-login:hover {
      background: var(--primary-hover);
    }

    .login-alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.825rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .login-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-floating-actions">
      <button id="btn-theme-toggle" class="btn-theme-nav" type="button" title="Alternar tema" aria-label="Alternar tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <h1 class="login-title">Controle Financeiro Rural</h1>
        <p class="login-sub">Gestão fiscal e financeira integrada</p>
      </div>

      {% if erro %}
      <div class="login-alert-error" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ erro }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{% url 'extrator_fiscal:login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">

        <div class="login-form-group">
          <label for="username" class="login-label">Usuário</label>
          <input type="text" id="username" name="username" class="login-input" placeholder="Digite seu usuário" required autofocus autocomplete="username">
        </div>

        <div class="login-form-group">
          <label for="password" class="login-label">Senha</label>
          <input type="password" id="password" name="password" class="login-input" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login" id="btn-login-submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Entrar no Sistema</span>
        </button>
      </form>

      <div class="login-footer">
        UniRV — Universidade de Rio Verde<br>
        Ambiente Seguro • DOO
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('btn-theme-toggle');
      function updateTheme(th) {
        document.documentElement.setAttribute('data-theme', th);
        document.body.setAttribute('data-theme', th);
        try { localStorage.setItem('rural_theme', th); } catch (e) {}
      }
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      updateTheme(cur);
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const next = (document.documentElement.getAttribute('data-theme') === 'dark') ? 'light' : 'dark';
          updateTheme(next);
        });
      }
    });
  </script>
</body>
</html>
